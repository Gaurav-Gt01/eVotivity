apiVersion: apps/v1
kind: Deployment
metadata:
  name: evotivity-backend-deployment
  namespace: default
  labels:
    app: evotivity-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: evotivity-backend
  template:
    metadata:
      labels:
        app: evotivity-backend
    spec:
      containers:
      - name: backend-api
        image: evotivity/backend-api-service:latest
        ports:
        - containerPort: 5001
        env:
        - name: PORT
          value: "5001"
        - name: MYSQL_HOST
          value: "mysql-service"
        - name: REDIS_HOST
          value: "redis-service"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: evotivity-backend-service
spec:
  type: ClusterIP
  selector:
    app: evotivity-backend
  ports:
  - port: 5001
    targetPort: 5001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: evotivity-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: evotivity-backend-deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
