apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: evotivity-api-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/limit-rps: "100"
spec:
  rules:
  - host: evotivity.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: evotivity-backend-service
            port:
              number: 5001
      - path: /
        pathType: Prefix
        backend:
          service:
            name: evotivity-frontend-service
            port:
              number: 3000
